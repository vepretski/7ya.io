<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>7YA Launch Visual — Igor Vepretski</title>
  <meta name="description" content="אות ההשקה הרשמי של 7YA.IO — הבית הציבורי של איגור ופרצקי, ההיסטוריה, השותפים ומערכת ההוכחות הדיגיטלית.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://7ya.io/launch/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="7YA.IO">
  <meta property="og:title" content="7YA Launch Signal — Igor Vepretski">
  <meta property="og:description" content="כניסה למערכת הציבורית של איגור ופרצקי ו־7YA.IO.">
  <meta property="og:url" content="https://7ya.io/launch/">
  <meta property="og:image" content="https://7ya.io/images/igor-vepretski-7ya-og.png">
  <meta name="theme-color" content="#050607">
  <style>
    :root{color-scheme:dark;--bg:#050607;--panel:#0b0e12;--line:rgba(242,201,109,.28);--gold:#f2c96d;--text:#f5f7fa;--muted:#a5acb8}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 50% 5%,#16130d 0,var(--bg) 36%,#020304 100%);color:var(--text);font-family:Arial,"Noto Sans Hebrew",sans-serif;min-height:100vh}
    .wrap{width:min(100% - 32px,920px);margin:0 auto;padding:32px 0 56px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
    .mark{color:var(--gold);font-weight:800;font-size:1.25rem}
    .visual{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:28px;background:var(--panel);box-shadow:0 24px 80px rgba(0,0,0,.45)}
    .visual img{display:block;width:100%;height:auto;min-height:360px;object-fit:cover;background:#090b0e}
    .fallback{display:none;min-height:520px;padding:clamp(30px,7vw,76px);align-items:flex-end;background:radial-gradient(circle at 70% 25%,rgba(242,201,109,.18),transparent 33%),linear-gradient(145deg,#10141b,#050607)}
    .fallback h1{margin:0;max-width:760px;font-size:clamp(3rem,10vw,7rem);line-height:.88;letter-spacing:-.06em}
    .fallback h1 span{color:var(--gold)}
    .actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
    a{color:inherit;text-decoration:none}
    .primary,.secondary{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:999px;font-weight:700}
    .primary{background:var(--gold);color:#111}
    .secondary{border:1px solid var(--line);background:rgba(255,255,255,.03)}
    .note{margin-top:18px;color:var(--muted);line-height:1.6}
    @media(max-width:600px){.wrap{width:min(100% - 20px,920px);padding-top:18px}.top{align-items:flex-start}.visual,.visual img{border-radius:20px}.fallback{min-height:430px}}
  </style>
  <script defer src="/assets/7ya-analytics.js?v=20260711"></script>
</head>
<body>
  <main class="wrap">
    <div class="top"><span class="mark">7YA</span><span>IGOR VEPRETSKI / OFFICIAL LAUNCH SIGNAL</span></div>
    <section class="visual" aria-label="7YA Launch Signal">
      <img src="/images/7ya_launch_visual_master.png" alt="7YA Launch Signal" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="fallback" aria-hidden="true"><h1>IGOR VEPRETSKI.<br><span>THE LIVING PROOF SYSTEM.</span></h1></div>
    </section>
    <div class="actions">
      <a class="primary" href="/">כניסה ל־7ya.io</a>
      <a class="secondary" href="/igor-vepretski/">איגור ופרצקי</a>
      <a class="secondary" href="/partners/">שותפים ואקוסיסטם</a>
      <a class="secondary" href="/evidence/">Evidence Ledger</a>
    </div>
    <p class="note">זהות ציבורית, היסטוריה, StartOn, שותפים, מדיה ומערכת הוכחות — תחת מקור אמת אחד.</p>
  </main>
</body>
</html>
