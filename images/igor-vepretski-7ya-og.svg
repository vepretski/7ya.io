      <stop offset="0" stop-color="#020405"/>
      <stop offset="0.55" stop-color="#07151a"/>
      <stop offset="1" stop-color="#010203"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38ecff"/>
