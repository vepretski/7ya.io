name: Repair, dispatch and observe canonical Pages

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/actions-observer.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Repair CSS gate, dispatch and record Pages workflow
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = 'dev';
            const workflowPath = '.github/workflows/pages.yml';

            let repair = { changed: false, commit_sha: null, error: null };
            try {
              const current = await github.rest.repos.getContent({
                owner,
                repo,
                path: workflowPath,
                ref: branch
              });
              const original = Buffer.from(current.data.content, 'base64').toString('utf8');
              const corrected = original.replace(
                "grep -Fq -- '--ink:'",
                "grep -Fq -- '--personal-bg:'"
              );
              if (corrected !== original) {
                const update = await github.rest.repos.createOrUpdateFileContents({
                  owner,
                  repo,
                  path: workflowPath,
                  branch,
                  message: 'fix: validate canonical Infostory CSS marker',
                  content: Buffer.from(corrected).toString('base64'),
                  sha: current.data.sha
                });
                repair.changed = true;
                repair.commit_sha = update.data.commit.sha;
              }
            } catch (error) {
              repair.error = {
                status: error.status || null,
                message: error.message || String(error)
              };
            }

            let dispatch = { accepted: false, error: null };
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'pages.yml',
                ref: branch
              });
              dispatch.accepted = true;
            } catch (error) {
              dispatch.error = {
                status: error.status || null,
                message: error.message || String(error)
              };
            }

            await new Promise(resolve => setTimeout(resolve, 7000));

            let runs = [];
            let listError = null;
            try {
              const response = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'pages.yml',
                branch,
                per_page: 20
              });
              runs = response.data.workflow_runs.map(run => ({
                id: run.id,
                name: run.name,
                event: run.event,
                status: run.status,
                conclusion: run.conclusion,
                head_sha: run.head_sha,
                run_attempt: run.run_attempt,
                created_at: run.created_at,
                updated_at: run.updated_at,
                html_url: run.html_url
              }));
            } catch (error) {
              listError = {
                status: error.status || null,
                message: error.message || String(error)
              };
            }

            const payload = {
              schema_version: 3,
              recorded_at: new Date().toISOString(),
              observer_run_id: context.runId,
              workflow: workflowPath,
              repair,
              dispatch,
              list_error: listError,
              runs
            };
            const statusPath = '.pages-runs.json';
            let statusSha;
            try {
              const currentStatus = await github.rest.repos.getContent({
                owner,
                repo,
                path: statusPath,
                ref: branch
              });
              statusSha = currentStatus.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path: statusPath,
              branch,
              message: `ops: repair, dispatch and snapshot Pages from ${context.runId}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              sha: statusSha
            });
