name: Observe GitHub Actions runs

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/actions-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Record recent workflow runs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              branch: 'dev',
              per_page: 30
            });
            const runs = response.data.workflow_runs.map(run => ({
              id: run.id,
              name: run.name,
              event: run.event,
              status: run.status,
              conclusion: run.conclusion,
              head_sha: run.head_sha,
              run_attempt: run.run_attempt,
              created_at: run.created_at,
              updated_at: run.updated_at,
              html_url: run.html_url
            }));
            const payload = {
              schema_version: 1,
              recorded_at: new Date().toISOString(),
              observer_run_id: context.runId,
              runs
            };
            const path = '.actions-runs.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'dev' });
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'dev',
              message: `ops: snapshot Actions runs from ${context.runId}`,
              content: Buffer.from(JSON.stringify(payload, null, 2) + '\n').toString('base64'),
              sha
            });
