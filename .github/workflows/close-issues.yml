name: close-issues

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Close only stale issues explicitly labelled autoclose
        required: true
        type: boolean
        default: false

jobs:
  close:
    if: ${{ inputs.confirm == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Close stale issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STALE_ISSUE_LABEL: autoclose
        run: bun script/github/close-issues.ts
