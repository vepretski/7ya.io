name: Deploy 7YA.IO — Cinematic Life Story

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/pages.yml"
      - ".pages-trigger"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  CANONICAL_REPOSITORY: 7guard-io/7ya.io
  CANONICAL_SHA: f0e68572a214609e91c431355c8d59aae6910627
  EXPECTED_BUILD: igor-story-cinema-guide-20260716-2
  EXPECTED_EXPERIENCE: IGOR_CINEMATIC_GUIDED_CONTENT_INTELLIGENCE

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout immutable cinematic story source
        uses: actions/checkout@v4
        with:
          repository: 7guard-io/7ya.io
          ref: f0e68572a214609e91c431355c8d59aae6910627
          path: canonical
          fetch-depth: 1

      - name: Validate cinematic life-story release
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          cd canonical

          test "$(cat CNAME)" = "7ya.io"
          for file in index.html 404.html CNAME robots.txt sitemap.xml favicon.svg sw.js service-worker.js release.json; do
            test -s "$file" || { echo "Missing public file: $file"; exit 1; }
          done

          for route in museum create history igor-vepretski journey starton influence evidence 7ya speaker talk media articles contact delta-audit; do
            test -s "$route/index.html" || { echo "Missing route: $route"; exit 1; }
          done

          test -s styles/igor-story-cinema-20260716.css
          test -s styles/7ya-experience-guide-20260716.css
          test -s scripts/igor-story-cinema-20260716.js
          test -s scripts/7ya-experience-guide-20260716.js
          test -s assets/igor-hero-storm-20260715.webp
          test -s assets/igor-home-portrait-20260712.webp
          test -s assets/igor-home-portrait-20260712.jpg
          for image in 01-origins.webp 02-public-voice.webp 03-creator-night.webp 04-force-system.webp; do
            test -s "assets/infostory/$image" || { echo "Missing narrative scene asset: $image"; exit 1; }
          done

          grep -Fq 'איגור ופרצקי | סיפור של כוח שבונה' index.html
          grep -Fq "$EXPECTED_BUILD" index.html
          for scene in opening origins service voice human starton system finale; do
            grep -Fq "id=\"$scene\"" index.html || { echo "Missing story scene: $scene"; exit 1; }
          done
          grep -Fq '/styles/igor-story-cinema-20260716.css?v=1' index.html
          grep -Fq '/styles/7ya-experience-guide-20260716.css?v=1' index.html
          grep -Fq '/scripts/igor-story-cinema-20260716.js' index.html
          grep -Fq '/scripts/7ya-experience-guide-20260716.js' index.html
          grep -Fq 'id="discover"' index.html
          grep -Fq 'id="guidePanel"' index.html
          grep -Fq '7 / השומר' index.html
          ! grep -Fq 'history-song-20260714.css' index.html
          ! grep -Fq 'igor-infostory-20260716.css' index.html
          ! grep -Fq 'history-song-20260714.js' index.html
          ! grep -Fq 'igor-infostory-20260716.js' index.html
          test "$(grep -o '<h1\b' index.html | wc -l | tr -d ' ')" = "1"
          node --check scripts/igor-story-cinema-20260716.js
          node --check scripts/7ya-experience-guide-20260716.js

          if grep -RIl $'\xEF\xBF\xBD' index.html styles/igor-story-cinema-20260716.css scripts/igor-story-cinema-20260716.js; then
            echo "Unicode replacement character found in release files"
            exit 1
          fi

          echo 'IGOR_CINEMATIC_STORY_SOURCE_GATE: PASS'

      - name: Assemble immutable Pages artifact
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          cp canonical/index.html canonical/404.html canonical/CNAME canonical/robots.txt \
            canonical/sitemap.xml canonical/favicon.svg canonical/sw.js \
            canonical/service-worker.js dist/

          for optional in manifest.webmanifest site.webmanifest browserconfig.xml; do
            if [ -s "canonical/$optional" ]; then cp "canonical/$optional" dist/; fi
          done

          for path in styles scripts assets images data knowledge history museum create entity response-ai \
            igor-vepretski journey starton influence evidence 7ya speaker talk media articles contact \
            delta-audit legacy about social oracle business pass member-pass radar work systems \
            public-service music healthz; do
            if [ -e "canonical/$path" ]; then cp -RL "canonical/$path" dist/; fi
          done

          jq \
            --arg sha "$CANONICAL_SHA" \
            --arg release "github-pages-igor-cinematic-story-$CANONICAL_SHA" \
            --arg experience "$EXPECTED_EXPERIENCE" \
            '.source_repository = "7guard-io/7ya.io" |
             .source_path = "/" |
             .source_sha = $sha |
             .source_ref = $sha |
             .provider = "github-pages" |
             .status = "READY" |
             .release = $release |
             .environment = "production" |
             .experience = $experience' \
            canonical/release.json > dist/release.json

          touch dist/.nojekyll

          test -s dist/index.html
          test -s dist/museum/index.html
          test -s dist/create/index.html
          test -s dist/styles/igor-story-cinema-20260716.css
          test -s dist/styles/7ya-experience-guide-20260716.css
          test -s dist/scripts/igor-story-cinema-20260716.js
          test -s dist/scripts/7ya-experience-guide-20260716.js
          test -s dist/assets/igor-hero-storm-20260715.webp
          test -s dist/release.json
          grep -Fq "$EXPECTED_BUILD" dist/index.html
          grep -Fq "$EXPECTED_EXPERIENCE" dist/release.json

          echo 'PAGES_IGOR_CINEMATIC_STORY_ARTIFACT: PASS'
          du -sh dist

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify 7ya.io serves cinematic life story
        id: verify_public
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            echo "Public verification attempt ${attempt}/30"

            release="$(curl -fsSL --connect-timeout 8 --max-time 20 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "https://7ya.io/release.json?release-check=${nonce}" || true)"

            if jq -e \
              --arg sha "$CANONICAL_SHA" \
              --arg experience "$EXPECTED_EXPERIENCE" \
              '.source_sha == $sha and .experience == $experience and .status == "READY"' \
              <<<"$release" >/dev/null 2>&1; then
              homepage="$(curl -fsSL --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "https://7ya.io/?release-check=${nonce}")"
              css="$(curl -fsSL --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "https://7ya.io/styles/igor-story-cinema-20260716.css?release-check=${nonce}")"
              javascript="$(curl -fsSL --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "https://7ya.io/scripts/igor-story-cinema-20260716.js?release-check=${nonce}")"
              guide_css="$(curl -fsSL --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "https://7ya.io/styles/7ya-experience-guide-20260716.css?release-check=${nonce}")"
              guide_javascript="$(curl -fsSL --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "https://7ya.io/scripts/7ya-experience-guide-20260716.js?release-check=${nonce}")"
              hero_headers="$(curl -fsSI --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "https://7ya.io/assets/igor-hero-storm-20260715.webp?release-check=${nonce}")"

              grep -Fq "$EXPECTED_BUILD" <<<"$homepage"
              grep -Fq 'סיפור של כוח שבונה' <<<"$homepage"
              grep -Fq 'id="origins"' <<<"$homepage"
              grep -Fq 'id="human"' <<<"$homepage"
              grep -Fq 'id="discover"' <<<"$homepage"
              grep -Fq 'id="guidePanel"' <<<"$homepage"
              grep -Fq -- '--gold:#c6a062' <<<"$css"
              grep -Fq 'sceneVisibility' <<<"$javascript"
              grep -Fq '.content-intelligence' <<<"$guide_css"
              grep -Fq 'public-universe-records-20260715.json' <<<"$guide_javascript"
              grep -Eiq '^content-type: image/(webp|octet-stream)' <<<"$hero_headers"
              echo 'PUBLIC_7YA_CINEMATIC_STORY_GATE: PASS'
              exit 0
            fi

            current_sha="$(jq -r '.source_sha // "unavailable"' <<<"$release" 2>/dev/null || echo unavailable)"
            current_experience="$(jq -r '.experience // "unavailable"' <<<"$release" 2>/dev/null || echo unavailable)"
            echo "Current public SHA: ${current_sha}; experience: ${current_experience}"
            sleep 10
          done

          echo 'Public domain did not converge to the cinematic life-story release within the verification window.'
          exit 1

      - name: Record deterministic deployment state
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PUBLIC_VERIFY_OUTCOME: ${{ steps.verify_public.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '.pages-status.json';
            const branch = 'dev';
            const outcomes = {
              validate: process.env.VALIDATE_OUTCOME || 'unknown',
              assemble: process.env.ASSEMBLE_OUTCOME || 'unknown',
              configure: process.env.CONFIGURE_OUTCOME || 'unknown',
              upload: process.env.UPLOAD_OUTCOME || 'unknown',
              deploy: process.env.DEPLOY_OUTCOME || 'unknown',
              public_verify: process.env.PUBLIC_VERIFY_OUTCOME || 'unknown'
            };
            const fullyVerified = outcomes.deploy === 'success' && outcomes.public_verify === 'success';
            const state = {
              schema_version: 3,
              recorded_at: new Date().toISOString(),
              workflow_run_id: context.runId,
              workflow_run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
              triggering_commit: context.sha,
              source_repository: process.env.CANONICAL_REPOSITORY,
              source_sha: process.env.CANONICAL_SHA,
              expected_build: process.env.EXPECTED_BUILD,
              expected_experience: process.env.EXPECTED_EXPERIENCE,
              page_url: process.env.PAGE_URL || null,
              outcomes,
              result: fullyVerified ? 'PUBLICLY_VERIFIED' : (outcomes.deploy === 'success' ? 'DEPLOYED_PENDING_PUBLIC_CONVERGENCE' : 'FAILED')
            };
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: `ops: record Pages run ${context.runId} as ${state.result}`,
              content: Buffer.from(JSON.stringify(state, null, 2) + '\n').toString('base64'),
              sha: existingSha
            });
