name: Deploy canonical 7YA.IO

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/pages.yml"
      - ".pages-trigger"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  CANONICAL_REPOSITORY: 7guard-io/7ya.io
  CANONICAL_SHA: c98afbe5f25986b71437db8b35f052347068d859

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout immutable canonical source
        uses: actions/checkout@v4
        with:
          repository: 7guard-io/7ya.io
          ref: c98afbe5f25986b71437db8b35f052347068d859
          path: canonical
          fetch-depth: 1

      - name: Validate public release
        shell: bash
        run: |
          set -euo pipefail
          cd canonical
          test "$(cat CNAME)" = "7ya.io"
          for file in index.html 404.html robots.txt sitemap.xml favicon.svg sw.js service-worker.js; do
            test -s "$file" || { echo "Missing public file: $file"; exit 1; }
          done
          for route in igor-vepretski journey starton influence evidence 7ya speaker talk media articles contact delta-audit; do
            test -s "$route/index.html" || { echo "Missing route: $route"; exit 1; }
          done
          test -s assets/igor-home-portrait-20260712.webp
          test -s assets/igor-home-og-20260712.jpg
          grep -qi "איגור ופרצקי" index.html
          grep -qi "IGOR VEPRETSKI" index.html
          grep -qi "Evidence Ledger" index.html
          grep -qi "Igor before infrastructure" 7ya/index.html
          if grep -R -nE "Igor Ido Vepretski|Ido Vepretski|עידו ופרצקי" \
            index.html igor-vepretski journey starton influence evidence 7ya speaker talk media articles contact; then
            echo "Unsupported identity alias found"
            exit 1
          fi

      - name: Assemble immutable production artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp canonical/index.html canonical/404.html canonical/CNAME canonical/robots.txt \
            canonical/sitemap.xml canonical/favicon.svg canonical/sw.js \
            canonical/service-worker.js dist/
          for path in styles scripts assets images data knowledge igor-vepretski journey \
            starton influence evidence 7ya speaker talk media articles contact delta-audit \
            legacy about social oracle business pass member-pass radar work systems \
            public-service music healthz; do
            if [ -e "canonical/$path" ]; then cp -RL "canonical/$path" dist/; fi
          done
          jq \
            --arg sha "$CANONICAL_SHA" \
            --arg release "github-pages-$CANONICAL_SHA" \
            '.source_repository = "7guard-io/7ya.io" |
             .source_path = "/" |
             .source_sha = $sha |
             .provider = "github-pages" |
             .status = "READY" |
             .release = $release |
             .environment = "production"' \
            canonical/release.json > dist/release.json
          touch dist/.nojekyll
          test -s dist/release.json
          test -s dist/contact/index.html
          test -s dist/assets/igor-home-portrait-20260712.webp
          du -sh dist

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
