name: Deploy 7YA.IO — Tactical Identity Ecosystem

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/pages.yml"
      - ".pages-trigger"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  CANONICAL_REPOSITORY: 7guard-io/7ya.io
  CANONICAL_SHA: b56fd11d3b7319e6d9d2377c511acee17f978cbf
  EXPECTED_BUILD: 7ya-tactical-ontology-20260717-1
  EXPECTED_EXPERIENCE: IGOR_TACTICAL_ONTOLOGY_ECOSYSTEM

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout immutable tactical homepage source
        uses: actions/checkout@v4
        with:
          repository: 7guard-io/7ya.io
          ref: b56fd11d3b7319e6d9d2377c511acee17f978cbf
          path: canonical
          fetch-depth: 1

      - name: Validate tactical ontology release
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          cd canonical

          test "$(cat CNAME)" = "7ya.io"
          for file in index.html 404.html CNAME robots.txt sitemap.xml favicon.svg sw.js service-worker.js release.json; do
            test -s "$file" || { echo "Missing public file: $file"; exit 1; }
          done

          for route in museum create history igor-vepretski journey starton influence evidence 7ya speaker talk media articles contact delta-audit; do
            test -s "$route/index.html" || { echo "Missing route: $route"; exit 1; }
          done

          test -s styles/igor-personal-hero-20260716.css
          test -s styles/7ya-tactical-ontology-20260717.css
          test -s scripts/igor-personal-hero-20260716.js
          test -s scripts/7ya-tactical-ontology-20260717.js
          test -s data/7ya-system-v1.json

          for image in igor-hero.webp igor-executive.webp igor-speaker.webp igor-public-service.webp igor-closeup.webp; do
            test -s "assets/personal-hero-20260716/$image" || { echo "Missing personal homepage asset: $image"; exit 1; }
          done

          grep -Fq "$EXPECTED_BUILD" index.html
          grep -Fq 'IGOR</span><strong>VEPRETSKI' index.html
          for section in identity impact trajectory systems starton frameworks media sources; do
            grep -Fq "id=\"$section\"" index.html || { echo "Missing homepage section: $section"; exit 1; }
          done
          grep -Fq '/styles/7ya-tactical-ontology-20260717.css?v=1' index.html
          grep -Fq '/scripts/7ya-tactical-ontology-20260717.js?v=1' index.html
          grep -Fq 'ארבעה צמתים.' index.html
          grep -Fq 'PLAY</b>' index.html
          grep -Fq 'Evidence before amplification' index.html || grep -Fq 'EVIDENCE BEFORE AMPLIFICATION' index.html
          test "$(grep -o '<h1\b' index.html | wc -l | tr -d ' ')" = "1"

          node --check scripts/igor-personal-hero-20260716.js
          node --check scripts/7ya-tactical-ontology-20260717.js
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('data/7ya-system-v1.json','utf8')); if(d.ontology_root!=='7ya_system_v1') process.exit(1); if(d.global_metrics.verified_media_exposure.public_disclosure!=='BLOCKED') process.exit(1);"

          if grep -Fq '5.1B+' index.html; then
            echo 'Blocked exposure metric leaked into the public homepage'
            exit 1
          fi

          if grep -RIl $'\xEF\xBF\xBD' index.html styles/7ya-tactical-ontology-20260717.css scripts/7ya-tactical-ontology-20260717.js data/7ya-system-v1.json; then
            echo "Unicode replacement character found in release files"
            exit 1
          fi

          echo 'TACTICAL_ONTOLOGY_SOURCE_GATE: PASS'

      - name: Assemble immutable Pages artifact
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          cp canonical/index.html canonical/404.html canonical/CNAME canonical/robots.txt \
            canonical/sitemap.xml canonical/favicon.svg canonical/sw.js \
            canonical/service-worker.js dist/

          for optional in manifest.webmanifest site.webmanifest browserconfig.xml; do
            if [ -s "canonical/$optional" ]; then cp "canonical/$optional" dist/; fi
          done

          for path in styles scripts assets images data knowledge history museum create entity response-ai \
            igor-vepretski journey starton influence evidence 7ya speaker talk media articles contact \
            delta-audit legacy about social oracle business pass member-pass radar work systems \
            public-service music healthz; do
            if [ -e "canonical/$path" ]; then cp -RL "canonical/$path" dist/; fi
          done

          jq \
            --arg sha "$CANONICAL_SHA" \
            --arg release "github-pages-tactical-ontology-$CANONICAL_SHA" \
            --arg experience "$EXPECTED_EXPERIENCE" \
            '.source_repository = "7guard-io/7ya.io" |
             .source_path = "/" |
             .source_sha = $sha |
             .source_ref = $sha |
             .provider = "github-pages" |
             .status = "READY" |
             .release = $release |
             .environment = "production" |
             .experience = $experience' \
            canonical/release.json > dist/release.json

          touch dist/.nojekyll

          test -s dist/index.html
          test -s dist/styles/7ya-tactical-ontology-20260717.css
          test -s dist/scripts/7ya-tactical-ontology-20260717.js
          test -s dist/data/7ya-system-v1.json
          test -s dist/assets/personal-hero-20260716/igor-hero.webp
          test -s dist/release.json
          grep -Fq "$EXPECTED_BUILD" dist/index.html
          grep -Fq "$EXPECTED_EXPERIENCE" dist/release.json

          echo 'PAGES_TACTICAL_ONTOLOGY_ARTIFACT: PASS'
          du -sh dist

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify 7ya.io serves tactical ontology release
        id: verify_public
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 30); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            echo "Public verification attempt ${attempt}/30"

            release="$(curl -fsSL --connect-timeout 8 --max-time 20 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "https://7ya.io/release.json?release-check=${nonce}" || true)"

            if jq -e \
              --arg sha "$CANONICAL_SHA" \
              --arg experience "$EXPECTED_EXPERIENCE" \
              '.source_sha == $sha and .experience == $experience and .status == "READY"' \
              <<<"$release" >/dev/null 2>&1; then
              homepage="$(curl -fsSL --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "https://7ya.io/?release-check=${nonce}")"
              css="$(curl -fsSL --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "https://7ya.io/styles/7ya-tactical-ontology-20260717.css?release-check=${nonce}")"
              javascript="$(curl -fsSL --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "https://7ya.io/scripts/7ya-tactical-ontology-20260717.js?release-check=${nonce}")"
              ontology="$(curl -fsSL --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "https://7ya.io/data/7ya-system-v1.json?release-check=${nonce}")"
              hero_headers="$(curl -fsSI --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "https://7ya.io/assets/personal-hero-20260716/igor-hero.webp?release-check=${nonce}")"

              grep -Fq "$EXPECTED_BUILD" <<<"$homepage"
              grep -Fq 'IGOR</span><strong>VEPRETSKI' <<<"$homepage"
              grep -Fq 'id="impact"' <<<"$homepage"
              grep -Fq 'id="starton"' <<<"$homepage"
              grep -Fq 'id="frameworks"' <<<"$homepage"
              grep -Fq '.ontology-grid' <<<"$css"
              grep -Fq 'loadOntology' <<<"$javascript"
              jq -e '.ontology_root == "7ya_system_v1" and .global_metrics.verified_media_exposure.public_disclosure == "BLOCKED"' <<<"$ontology" >/dev/null
              grep -Eiq '^content-type: image/(webp|octet-stream)' <<<"$hero_headers"
              echo 'PUBLIC_7YA_TACTICAL_ONTOLOGY_GATE: PASS'
              exit 0
            fi

            current_sha="$(jq -r '.source_sha // "unavailable"' <<<"$release" 2>/dev/null || echo unavailable)"
            current_experience="$(jq -r '.experience // "unavailable"' <<<"$release" 2>/dev/null || echo unavailable)"
            echo "Current public SHA: ${current_sha}; experience: ${current_experience}"
            sleep 10
          done

          echo 'Public domain did not converge to the tactical ontology release within the verification window.'
          exit 1

      - name: Record deterministic deployment state
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PUBLIC_VERIFY_OUTCOME: ${{ steps.verify_public.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '.pages-status.json';
            const branch = 'dev';
            const outcomes = {
              validate: process.env.VALIDATE_OUTCOME || 'unknown',
              assemble: process.env.ASSEMBLE_OUTCOME || 'unknown',
              configure: process.env.CONFIGURE_OUTCOME || 'unknown',
              upload: process.env.UPLOAD_OUTCOME || 'unknown',
              deploy: process.env.DEPLOY_OUTCOME || 'unknown',
              public_verify: process.env.PUBLIC_VERIFY_OUTCOME || 'unknown'
            };
            const fullyVerified = outcomes.deploy === 'success' && outcomes.public_verify === 'success';
            const state = {
              schema_version: 4,
              recorded_at: new Date().toISOString(),
              workflow_run_id: context.runId,
              workflow_run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
              triggering_commit: context.sha,
              source_repository: process.env.CANONICAL_REPOSITORY,
              source_sha: process.env.CANONICAL_SHA,
              expected_build: process.env.EXPECTED_BUILD,
              expected_experience: process.env.EXPECTED_EXPERIENCE,
              page_url: process.env.PAGE_URL || null,
              outcomes,
              result: fullyVerified ? 'PUBLICLY_VERIFIED' : (outcomes.deploy === 'success' ? 'DEPLOYED_PENDING_PUBLIC_CONVERGENCE' : 'FAILED')
            };
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: `ops: record Pages run ${context.runId} as ${state.result}`,
              content: Buffer.from(JSON.stringify(state, null, 2) + '\n').toString('base64'),
              sha: existingSha
            });
