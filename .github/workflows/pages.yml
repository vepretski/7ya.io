name: Publish 7YA Static Site

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 7ya-production-publisher
  cancel-in-progress: true

jobs:
  publish:
    name: Publish immutable last-known-good release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh generated feeds
        continue-on-error: true
        shell: bash
        run: |
          set -u
          python3 scripts/generate_public_index_feeds.py

      - name: Run evidence audit
        continue-on-error: true
        shell: bash
        run: |
          set -u
          python3 scripts/validate_evidence_ledger_v3.py

      - name: Build immutable production snapshot
        shell: bash
        run: |
          set -euo pipefail

          source_root="packages/app/public"
          release_root="dist-deploy"

          test -d "$source_root"
          test -s "$source_root/index.html"

          rm -rf "$release_root"
          mkdir -p "$release_root"
          cp -aL "$source_root"/. "$release_root"/

          printf '7ya.io\n' > "$release_root/CNAME"
          touch "$release_root/.nojekyll"

          if find "$release_root" -type l -print -quit | grep -q .; then
            echo "Release snapshot contains a symlink"
            exit 1
          fi

          test -s "$release_root/index.html"
          test "$(cat "$release_root/CNAME")" = "7ya.io"

      - name: Inject privacy-first analytics into every public page
        shell: bash
        run: |
          set -euo pipefail

          test -s dist-deploy/assets/7ya-analytics.js
          node --check dist-deploy/assets/7ya-analytics.js

          python3 - <<'PY'
          from pathlib import Path

          root = Path("dist-deploy")
          marker = "/assets/7ya-analytics.js"
          snippet = '  <script defer src="/assets/7ya-analytics.js?v=20260711"></script>\n'
          injected = 0
          already_present = 0
          skipped = []

          for path in root.rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              if marker in text:
                  already_present += 1
                  continue

              closing_head = text.lower().rfind("</head>")
              if closing_head < 0:
                  skipped.append(str(path))
                  continue

              path.write_text(
                  text[:closing_head] + snippet + text[closing_head:],
                  encoding="utf-8",
              )
              injected += 1

          tracked = injected + already_present
          if tracked == 0:
              raise SystemExit("No HTML pages received the analytics loader")

          if skipped:
              print("Analytics injection skipped files without </head>:")
              for item in skipped:
                  print(f"- {item}")

          print(f"Analytics active on {tracked} HTML pages ({injected} newly injected)")
          PY

          grep -q '/assets/7ya-analytics.js' dist-deploy/index.html

      - name: Normalize social sharing image inside snapshot
        continue-on-error: true
        shell: bash
        run: |
          set -u

          release_root="dist-deploy"
          svg="$release_root/images/igor-vepretski-7ya-og.svg"
          png="$release_root/images/igor-vepretski-7ya-og.png"

          if [[ -s "$svg" && ! -s "$png" ]]; then
            if command -v magick >/dev/null 2>&1; then
              magick -background none "$svg" -strip -colors 256 "PNG8:$png" || true
            elif command -v convert >/dev/null 2>&1; then
              convert -background none "$svg" -strip -colors 256 "PNG8:$png" || true
            elif command -v rsvg-convert >/dev/null 2>&1; then
              rsvg-convert --width 1200 --height 630 --output "$png" "$svg" || true
            else
              sudo apt-get update || true
              sudo apt-get install -y --no-install-recommends librsvg2-bin || true
              command -v rsvg-convert >/dev/null 2>&1 && \
                rsvg-convert --width 1200 --height 630 --output "$png" "$svg" || true
            fi
          fi

          if [[ -s "$png" ]]; then
            python3 - <<'PY'
          from pathlib import Path

          root = Path("dist-deploy")
          old = "https://7ya.io/images/igor-vepretski-7ya-og.svg"
          new = "https://7ya.io/images/igor-vepretski-7ya-og.png"

          for path in root.rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".html", ".json", ".jsonld", ".xml"}:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if old in text:
                  path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          else
            echo "::warning::PNG social image was not generated; SVG remains as the non-blocking fallback"
          fi

      - name: Enforce production security invariant
        shell: bash
        run: |
          set -euo pipefail

          if grep -R -nE \
            "(sk-(proj-)?[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)" \
            dist-deploy; then
            echo "A secret-like value was detected in the public snapshot"
            exit 1
          fi

      - name: Preserve current production as rollback branch
        continue-on-error: true
        shell: bash
        run: |
          set -u
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || exit 0
          git push --force origin \
            refs/remotes/origin/gh-pages:refs/heads/gh-pages-last-known-good || true

      - name: Publish snapshot directly to gh-pages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd dist-deploy
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "deploy: 7YA.IO ${GITHUB_SHA}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:gh-pages

      - name: Report endpoint status without rolling back production
        continue-on-error: true
        shell: bash
        run: |
          set -u

          check_url() {
            local url="$1"
            local status="000"

            for attempt in 1 2 3 4 5 6; do
              status="$(curl --location --silent --show-error \
                --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 10 --max-time 30 "$url" || true)"
              echo "Attempt ${attempt}: ${url} -> ${status}"
              [[ "$status" == "200" ]] && return 0
              sleep 10
            done

            echo "::warning::${url} is not returning 200 yet"
            return 0
          }

          check_url "https://vepretski.github.io/7ya.io/"
          check_url "https://7ya.io/"
          check_url "https://www.7ya.io/"
