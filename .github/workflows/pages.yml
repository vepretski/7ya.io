name: Deploy cinematic 7YA.IO — Igor Infostory

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/pages.yml"
      - ".pages-trigger"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  CANONICAL_REPOSITORY: 7guard-io/7ya.io
  CANONICAL_SHA: 0db02d129724a8e16b4104c8ac4cad1a0864c63f

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout immutable cinematic source
        uses: actions/checkout@v4
        with:
          repository: 7guard-io/7ya.io
          ref: 0db02d129724a8e16b4104c8ac4cad1a0864c63f
          path: canonical
          fetch-depth: 1

      - name: Validate Igor Infostory release
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          cd canonical

          test "$(cat CNAME)" = "7ya.io"
          for file in index.html 404.html CNAME robots.txt sitemap.xml favicon.svg sw.js service-worker.js release.json; do
            test -s "$file" || { echo "Missing public file: $file"; exit 1; }
          done

          for route in museum create history igor-vepretski journey starton influence evidence 7ya speaker talk media articles contact delta-audit; do
            test -s "$route/index.html" || { echo "Missing route: $route"; exit 1; }
          done

          test -s styles/history-song-20260714.css
          test -s styles/igor-infostory-20260716.css
          test -s scripts/igor-infostory-20260716.js
          test -s assets/igor-home-portrait-20260712.webp
          test -s assets/igor-home-og-20260712.jpg
          for image in 01-origins.webp 02-public-voice.webp 03-creator-night.webp 04-force-system.webp; do
            test -s "assets/infostory/$image" || { echo "Missing Infostory image: $image"; exit 1; }
          done

          grep -Fq 'איגור ופרצקי | 7YA — חיים דיגיטליים כמערכת סיפור' index.html
          grep -Fq 'igor-infostory-personal-os-20260716-1' index.html
          grep -Fq 'id="infostory"' index.html
          grep -Fq '/museum/' index.html
          grep -Fq '/create/' index.html
          node --check scripts/igor-infostory-20260716.js

          if grep -RIl $'\xEF\xBF\xBD' index.html styles/igor-infostory-20260716.css scripts/igor-infostory-20260716.js; then
            echo "Unicode replacement character found in release files"
            exit 1
          fi

          echo 'IGOR_INFOSTORY_SOURCE_GATE: PASS'

      - name: Assemble immutable Pages artifact
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          cp canonical/index.html canonical/404.html canonical/CNAME canonical/robots.txt \
            canonical/sitemap.xml canonical/favicon.svg canonical/sw.js \
            canonical/service-worker.js dist/

          for optional in manifest.webmanifest site.webmanifest browserconfig.xml; do
            if [ -s "canonical/$optional" ]; then cp "canonical/$optional" dist/; fi
          done

          for path in styles scripts assets images data knowledge history museum create entity response-ai \
            igor-vepretski journey starton influence evidence 7ya speaker talk media articles contact \
            delta-audit legacy about social oracle business pass member-pass radar work systems \
            public-service music healthz; do
            if [ -e "canonical/$path" ]; then cp -RL "canonical/$path" dist/; fi
          done

          jq \
            --arg sha "$CANONICAL_SHA" \
            --arg release "github-pages-igor-infostory-$CANONICAL_SHA" \
            '.source_repository = "7guard-io/7ya.io" |
             .source_path = "/" |
             .source_sha = $sha |
             .source_ref = $sha |
             .provider = "github-pages" |
             .status = "READY" |
             .release = $release |
             .environment = "production" |
             .experience = "IGOR_CINEMATIC_DIGITAL_LIFE_INFOSTORY"' \
            canonical/release.json > dist/release.json

          touch dist/.nojekyll

          test -s dist/index.html
          test -s dist/museum/index.html
          test -s dist/create/index.html
          test -s dist/styles/igor-infostory-20260716.css
          test -s dist/scripts/igor-infostory-20260716.js
          test -s dist/assets/infostory/01-origins.webp
          test -s dist/release.json
          grep -Fq 'igor-infostory-personal-os-20260716-1' dist/index.html
          grep -Fq 'IGOR_CINEMATIC_DIGITAL_LIFE_INFOSTORY' dist/release.json

          echo 'PAGES_IGOR_INFOSTORY_ARTIFACT: PASS'
          du -sh dist

      - name: Configure Pages
        id: configure
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify 7ya.io serves the deployed release
        id: verify_public
        shell: bash
        run: |
          set -euo pipefail
          expected_sha="$CANONICAL_SHA"
          expected_build="igor-infostory-personal-os-20260716-1"
          expected_experience="IGOR_CINEMATIC_DIGITAL_LIFE_INFOSTORY"

          for attempt in $(seq 1 30); do
            nonce="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            echo "Public verification attempt ${attempt}/30"

            release="$(curl -fsSL --connect-timeout 8 --max-time 20 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              "https://7ya.io/release.json?release-check=${nonce}" || true)"

            if jq -e \
              --arg sha "$expected_sha" \
              --arg experience "$expected_experience" \
              '.source_sha == $sha and .experience == $experience and .status == "READY"' \
              <<<"$release" >/dev/null 2>&1; then
              homepage="$(curl -fsSL --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                -H 'Pragma: no-cache' \
                "https://7ya.io/?release-check=${nonce}")"
              grep -Fq "$expected_build" <<<"$homepage"
              grep -Fq 'חיים דיגיטליים כמערכת סיפור' <<<"$homepage"
              curl -fsSL --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "https://7ya.io/styles/igor-infostory-20260716.css?release-check=${nonce}" \
                | grep -Fq -- '--ink:'
              curl -fsSL --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "https://7ya.io/scripts/igor-infostory-20260716.js?release-check=${nonce}" \
                | grep -Fq 'infostory'
              curl -fsSI --connect-timeout 8 --max-time 20 \
                -H 'Cache-Control: no-cache, no-store, max-age=0' \
                "https://7ya.io/assets/infostory/01-origins.webp?release-check=${nonce}" \
                | grep -Eiq '^content-type: image/(webp|octet-stream)'
              echo 'PUBLIC_7YA_INFOSTORY_GATE: PASS'
              exit 0
            fi

            current_sha="$(jq -r '.source_sha // "unavailable"' <<<"$release" 2>/dev/null || echo unavailable)"
            current_experience="$(jq -r '.experience // "unavailable"' <<<"$release" 2>/dev/null || echo unavailable)"
            echo "Current public SHA: ${current_sha}; experience: ${current_experience}"
            sleep 10
          done

          echo 'Public domain did not converge to the deployed Infostory release within the verification window.'
          exit 1

      - name: Record deterministic deployment state
        if: always()
        uses: actions/github-script@v7
        env:
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          CONFIGURE_OUTCOME: ${{ steps.configure.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          PUBLIC_VERIFY_OUTCOME: ${{ steps.verify_public.outcome }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const path = '.pages-status.json';
            const branch = 'dev';
            const outcomes = {
              validate: process.env.VALIDATE_OUTCOME || 'unknown',
              assemble: process.env.ASSEMBLE_OUTCOME || 'unknown',
              configure: process.env.CONFIGURE_OUTCOME || 'unknown',
              upload: process.env.UPLOAD_OUTCOME || 'unknown',
              deploy: process.env.DEPLOY_OUTCOME || 'unknown',
              public_verify: process.env.PUBLIC_VERIFY_OUTCOME || 'unknown'
            };
            const fullyVerified = outcomes.deploy === 'success' && outcomes.public_verify === 'success';
            const state = {
              schema_version: 2,
              recorded_at: new Date().toISOString(),
              workflow_run_id: context.runId,
              workflow_run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 1),
              triggering_commit: context.sha,
              source_repository: process.env.CANONICAL_REPOSITORY,
              source_sha: process.env.CANONICAL_SHA,
              expected_build: 'igor-infostory-personal-os-20260716-1',
              expected_experience: 'IGOR_CINEMATIC_DIGITAL_LIFE_INFOSTORY',
              page_url: process.env.PAGE_URL || null,
              outcomes,
              result: fullyVerified ? 'PUBLICLY_VERIFIED' : (outcomes.deploy === 'success' ? 'DEPLOYED_PENDING_PUBLIC_CONVERGENCE' : 'FAILED')
            };
            let existingSha;
            try {
              const existing = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
              existingSha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch,
              message: `ops: record Pages run ${context.runId} as ${state.result}`,
              content: Buffer.from(JSON.stringify(state, null, 2) + '\n').toString('base64'),
              sha: existingSha
            });
