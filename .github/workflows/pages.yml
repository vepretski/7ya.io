name: Publish 7YA Static Site

on:
  push:
    branches:
      - dev
    paths:
      - "packages/app/public/**"
      - ".github/workflows/pages.yml"
      - "docs/ZERO_COST_PUBLISHING.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Validate and deploy static rescue release
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required static routes
        shell: bash
        run: |
          set -euo pipefail

          root="packages/app/public"
          required_files=(
            "index.html"
            "igor-vepretski/index.html"
            "journey/index.html"
            "blog/index.html"
            "talk/index.html"
            "social/index.html"
            "pass/index.html"
            "evidence/index.html"
            "trust/index.html"
            "starton/index.html"
            "contact/index.html"
            "radar/index.html"
            "visual-podcast/index.html"
            "data/blog-posts.json"
            "data/episodes.json"
            "data/public-evidence-ledger.json"
            "schema/visual-podcast.jsonld"
            "sitemap.xml"
            "robots.txt"
            "CNAME"
          )

          for file in "${required_files[@]}"; do
            test -f "$root/$file" || { echo "Missing required public file: $root/$file"; exit 1; }
          done

          html_files=(
            "$root/index.html"
            "$root/igor-vepretski/index.html"
            "$root/journey/index.html"
            "$root/blog/index.html"
            "$root/talk/index.html"
            "$root/social/index.html"
            "$root/pass/index.html"
            "$root/evidence/index.html"
            "$root/trust/index.html"
            "$root/starton/index.html"
            "$root/contact/index.html"
            "$root/radar/index.html"
            "$root/visual-podcast/index.html"
          )

          for html in "${html_files[@]}"; do
            grep -qi "<title>" "$html" || { echo "Missing <title>: $html"; exit 1; }
            grep -qi "name=\"description\"" "$html" || { echo "Missing meta description: $html"; exit 1; }
            grep -qi "rel=\"canonical\"" "$html" || { echo "Missing canonical link: $html"; exit 1; }
            if grep -qi "noindex" "$html"; then
              echo "Public route must not be noindexed: $html"
              exit 1
            fi
          done

          grep -q "https://7ya.io/sitemap.xml" "$root/robots.txt" || { echo "robots.txt must point to sitemap.xml"; exit 1; }
          grep -q "^7ya.io$" "$root/CNAME" || { echo "CNAME must be exactly 7ya.io"; exit 1; }

          for route in "/" "/igor-vepretski/" "/journey/" "/blog/" "/talk/" "/social/" "/pass/" "/evidence/" "/trust/" "/starton/" "/contact/" "/radar/" "/visual-podcast/"; do
            grep -q "https://7ya.io${route}" "$root/sitemap.xml" || { echo "Missing sitemap route: $route"; exit 1; }
          done

          grep -qi "Igor Vepretski is the person at the center" "$root/index.html" || { echo "Homepage missing required identity text"; exit 1; }
          grep -qi "7YA is the media, systems, evidence, and digital hub" "$root/index.html" || { echo "Homepage missing required 7YA role text"; exit 1; }
          grep -qi "StartOn is the social-impact lane" "$root/index.html" || { echo "Homepage missing required StartOn text"; exit 1; }
          grep -qi "Talk is the entry point" "$root/index.html" || { echo "Homepage missing required Talk text"; exit 1; }
          grep -qi "Visual Podcast is the evidence-first media layer" "$root/index.html" || { echo "Homepage missing required Visual Podcast text"; exit 1; }
          grep -qi "Public History" "$root/index.html" || { echo "Homepage missing Igor public-history link"; exit 1; }
          grep -qi "official public command surface" "$root/index.html" || { echo "Homepage missing founder-first framing"; exit 1; }
          grep -qi "Igor Vepretski is the person at the center" "$root/igor-vepretski/index.html" || { echo "Igor profile missing identity root statement"; exit 1; }
          grep -qi "History at a glance" "$root/igor-vepretski/index.html" || { echo "Igor profile missing timeline summary"; exit 1; }
          grep -qi "Public history · 1990–2026" "$root/journey/index.html" || { echo "Journey missing public-history framing"; exit 1; }
          grep -qi "The road to 7YA" "$root/journey/index.html" || { echo "Journey missing timeline heading"; exit 1; }
          grep -qi "Protected by design" "$root/journey/index.html" || { echo "Journey missing privacy boundary"; exit 1; }
          grep -qi "Igor Vepretski Editorial Desk" "$root/blog/index.html" || { echo "Blog missing founder-first editorial framing"; exit 1; }
          grep -qi "Closed by default" "$root/blog/index.html" || { echo "Blog portal must remain closed by default"; exit 1; }
          grep -qi "verified public fallback" "$root/blog/index.html" || { echo "Blog missing graceful fallback behavior"; exit 1; }
          grep -qi '"title": "Igor Vepretski Editorial Desk"' "$root/data/blog-posts.json" || { echo "Blog feed missing editorial title"; exit 1; }
          grep -qi "Evidence Ledger" "$root/evidence/index.html" || { echo "Evidence route missing ledger framing"; exit 1; }
          grep -qi "APPROVE" "$root/evidence/index.html" || { echo "Evidence route missing APPROVE gate"; exit 1; }
          grep -qi "VERIFY" "$root/evidence/index.html" || { echo "Evidence route missing VERIFY gate"; exit 1; }
          grep -qi "HOLD" "$root/evidence/index.html" || { echo "Evidence route missing HOLD gate"; exit 1; }
          grep -qi "public-evidence-ledger" "$root/evidence/index.html" || { echo "Evidence route must link the ledger JSON"; exit 1; }
          grep -qi "Talk is the entry point" "$root/talk/index.html" || { echo "Talk route missing entry point sentence"; exit 1; }
          grep -qi "Evidence Review" "$root/talk/index.html" || { echo "Talk route missing evidence-review intake lane"; exit 1; }
          grep -qi "Protected mode" "$root/talk/index.html" || { echo "Talk route missing protected-mode fallback"; exit 1; }
          grep -qi "7YA Trust" "$root/trust/index.html" || { echo "Trust route missing title framing"; exit 1; }
          grep -qi "Verification is not caution" "$root/trust/index.html" || { echo "Trust route missing leverage framing"; exit 1; }
          grep -qi "No raw HTTP errors" "$root/trust/index.html" || { echo "Trust route missing raw-error protection rule"; exit 1; }
          grep -qi '"ledger_name": "7YA.IO Public Evidence Ledger"' "$root/data/public-evidence-ledger.json" || { echo "Ledger JSON missing name"; exit 1; }
          grep -qi '"publication_gate": "APPROVE"' "$root/data/public-evidence-ledger.json" || { echo "Ledger JSON missing APPROVE gate"; exit 1; }
          grep -qi '"publication_gate": "VERIFY"' "$root/data/public-evidence-ledger.json" || { echo "Ledger JSON missing VERIFY gate"; exit 1; }
          grep -qi '"publication_gate": "HOLD"' "$root/data/public-evidence-ledger.json" || { echo "Ledger JSON missing HOLD gate"; exit 1; }
          grep -qi "No fake metrics" "$root/visual-podcast/index.html" || { echo "Visual Podcast missing no-fake-metrics rule"; exit 1; }
          grep -qi "No unverified sponsorship claims" "$root/visual-podcast/index.html" || { echo "Visual Podcast missing sponsorship boundary"; exit 1; }
          grep -qi "youtube-nocookie.com" "$root/visual-podcast/index.html" || { echo "Visual Podcast must use youtube-nocookie embed"; exit 1; }
          grep -qi "source_visible_pending_screenshot" "$root/data/episodes.json" || { echo "episodes.json missing evidence status"; exit 1; }
          grep -qi "PodcastSeries" "$root/schema/visual-podcast.jsonld" || { echo "Visual Podcast schema missing PodcastSeries"; exit 1; }

          if grep -R -nE "(sk-(proj-)?[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)" "$root"; then
            echo "Potential secret found in public static output"
            exit 1
          fi

          if grep -R -n "vercel.app" "$root"; then
            echo "Public static output must not expose a vercel.app URL"
            exit 1
          fi

      - name: Prepare static artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp -R packages/app/public/. dist/
          touch dist/.nojekyll
          test -f dist/CNAME || { echo "CNAME is required and must be tracked in packages/app/public"; exit 1; }

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
