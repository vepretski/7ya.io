name: Deploy GitHub Pages

# Deploy only the verified static release branch. The large development
# monorepo does not trigger Pages builds.
on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy verified gh-pages release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout verified release
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 1

      - name: Assemble immutable Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          git archive --format=tar HEAD | tar -xf - -C dist
          test -s dist/index.html
          test -s dist/igor-vepretski/index.html
          test -s dist/assets/igor-vepretski-portrait.svg
          test "$(cat dist/CNAME)" = "7ya.io"
          if grep -R -nE "Igor Ido Vepretski|Ido Vepretski|עידו ופרצקי" dist; then
            echo "Unsupported identity alias found"
            exit 1
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload verified artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
