name: Publish 7YA Static Site

on:
  push:
    branches:
      - dev
    paths:
      - "packages/app/public/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static artifact
        run: |
          test -f packages/app/public/igor-vepretski/index.html
          test -f packages/app/public/talk/index.html
          test -f packages/app/public/social/index.html
          mkdir -p dist
          cp -R packages/app/public/. dist/
          touch dist/.nojekyll
          if [ ! -f dist/CNAME ]; then echo "7ya.io" > dist/CNAME; fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
